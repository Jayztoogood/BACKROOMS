<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE BACKROOMS</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    text-shadow: 0 2px 4px #000;
}

#healthBox {
    position: absolute;
    left: 20px;
    bottom: 25px;
    width: 230px;
}

.label {
    font-size: 12px;
    margin-bottom: 5px;
    letter-spacing: 2px;
}

.bar {
    height: 17px;
    background: rgba(0,0,0,.65);
    border: 1px solid rgba(255,255,255,.3);
    margin-bottom: 10px;
}

.fill {
    height: 100%;
    width: 100%;
    transition: width .15s;
}

#health {
    background: #c93333;
}

#stamina {
    background: #d1c95c;
}

#objective {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 2px;
    text-align: center;
}

#playersHUD {
    position: absolute;
    top: 20px;
    right: 20px;
    text-align: right;
    font-size: 13px;
}

#crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    transform: translate(-50%, -50%);
    border: 1px solid white;
    border-radius: 50%;
}

#hint {
    position: absolute;
    bottom: 25px;
    right: 25px;
    font-size: 12px;
    color: #ddd;
    text-align: right;
}

#flashlightText {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: .7;
}

#message {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 24px;
    text-align: center;
    text-shadow: 0 3px 10px black;
    pointer-events: none;
}

#startScreen,
#endScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
}

.panel {
    width: 450px;
    max-width: 90%;
    background: rgba(18,17,8,.95);
    border: 1px solid #77704b;
    color: white;
    text-align: center;
    padding: 35px;
}

.panel h1 {
    letter-spacing: 5px;
    margin-top: 0;
}

.panel p {
    color: #aaa;
    line-height: 1.6;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    background: #c0b55e;
    color: #111;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #ddd273;
}

.hidden {
    display: none !important;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="hud">

    <div id="objective">
        FIND THE KEY
    </div>

    <div id="flashlightText">
        FLASHLIGHT: ON
    </div>

    <div id="playersHUD"></div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="healthBox">

        <div class="label">HEALTH</div>

        <div class="bar">
            <div class="fill" id="health"></div>
        </div>

        <div class="label">STAMINA</div>

        <div class="bar">
            <div class="fill" id="stamina"></div>
        </div>

    </div>

    <div id="hint">
        WASD — MOVE<br>
        SHIFT — SPRINT<br>
        F — FLASHLIGHT<br>
        ESC — RELEASE MOUSE
    </div>

</div>

<div id="startScreen">

    <div class="panel">

        <h1>THE BACKROOMS</h1>

        <p>
            You don't remember how you got here.
            <br><br>
            Find the key.
            <br>
            Find the exit.
            <br>
            Don't let it find you.
        </p>

        <button id="playButton">
            ENTER THE BACKROOMS
        </button>

    </div>

</div>

<div id="endScreen" class="hidden">

    <div class="panel">

        <h1 id="endTitle">GAME OVER</h1>

        <p id="endText"></p>

        <button onclick="location.href='index.html'">
            RETURN TO MENU
        </button>

    </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const SERVER = "wss://backrooms-avnx.onrender.com";

const params = new URLSearchParams(location.search);

const partyCode =
    params.get("party") ||
    localStorage.getItem("partyCode");

const sessionToken =
    localStorage.getItem("backroomsSession");

const playerName =
    localStorage.getItem("playerName") ||
    "Player";

if (!partyCode || !sessionToken) {

    location.href = "index.html";

}

let ws;

let connected = false;

let health = 100;

let stamina = 100;

let flashlightOn = true;

let gameEnded = false;

let keyCollected = false;

let lastSent = 0;

let damageCooldown = 0;

const remotePlayers = new Map();

const keys = {};

const clock = new THREE.Clock();

let yaw = 0;

let pitch = 0;

let canLook = false;

/* --------------------------------------------------
   THREE.JS
-------------------------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xaaa65f);

scene.fog = new THREE.Fog(
    0xaaa65f,
    12,
    85
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    .1,
    200
);

camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);

/* --------------------------------------------------
   LIGHTING
-------------------------------------------------- */

const ambient = new THREE.HemisphereLight(
    0xfff4bb,
    0x332c10,
    1.1
);

scene.add(ambient);

const flashlight = new THREE.SpotLight(
    0xffffff,
    80,
    30,
    Math.PI / 7,
    .5,
    1
);

flashlight.position.set(
    0,
    1.6,
    0
);

flashlight.castShadow = true;

camera.add(flashlight);

scene.add(camera);

/* --------------------------------------------------
   MATERIALS
-------------------------------------------------- */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xaaa35d,
        roughness: 1
    });

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x817a46,
        roughness: 1
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xd0c983,
        roughness: 1
    });

/* --------------------------------------------------
   WORLD
-------------------------------------------------- */

const walls = [];

const CELL = 6;

const maze = [

"#########################",
"#........#..............#",
"#........#..............#",
"#........#..............#",
"#........#..............#",
"#........#####.##########",
"#.......................#",
"#.####################..#",
"#.......................#",
"#........###########....#",
"#........#..............#",
"#........#..............#",
"#........#..............#",
"##########..............#",
"#.......................#",
"#....#################..#",
"#.......................#",
"#.......................#",
"#########################"

];

const rows = maze.length;
const cols = maze[0].length;

const worldWidth =
    cols * CELL;

const worldDepth =
    rows * CELL;

/* Floor */

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(
        worldWidth,
        worldDepth
    ),
    floorMaterial
);

floor.rotation.x = -Math.PI / 2;

floor.position.y = 0;

scene.add(floor);

/* Ceiling */

const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(
        worldWidth,
        worldDepth
    ),
    ceilingMaterial
);

ceiling.rotation.x = Math.PI / 2;

ceiling.position.y = 4;

scene.add(ceiling);

/* Walls */

for (let z = 0; z < rows; z++) {

    for (let x = 0; x < cols; x++) {

        if (maze[z][x] !== "#")
            continue;

        const wall = new THREE.Mesh(
            new THREE.BoxGeometry(
                CELL,
                4,
                CELL
            ),
            wallMaterial
        );

        wall.position.set(
            (x - cols / 2) * CELL + CELL / 2,
            2,
            (z - rows / 2) * CELL + CELL / 2
        );

        wall.castShadow = true;
        wall.receiveShadow = true;

        scene.add(wall);

        walls.push(wall);

    }

}

/* --------------------------------------------------
   FLUORESCENT LIGHTS
-------------------------------------------------- */

for (let z = 1; z < rows - 1; z += 2) {

    for (let x = 1; x < cols - 1; x += 3) {

        if (maze[z][x] !== ".")
            continue;

        const light = new THREE.PointLight(
            0xffffdd,
            5,
            17
        );

        light.position.set(
            (x - cols / 2) * CELL,
            3.7,
            (z - rows / 2) * CELL
        );

        scene.add(light);

        const lamp = new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                .08,
                .45
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffffdd
            })
        );

        lamp.position.copy(light.position);

        scene.add(lamp);

    }

}

/* --------------------------------------------------
   KEY
-------------------------------------------------- */

const key = new THREE.Mesh(
    new THREE.TorusGeometry(
        .22,
        .07,
        8,
        20
    ),
    new THREE.MeshStandardMaterial({
        color: 0xffd43b,
        emissive: 0x665000
    })
);

key.position.set(
    18,
    1,
    24
);

scene.add(key);

/* --------------------------------------------------
   EXIT
-------------------------------------------------- */

const exit = new THREE.Mesh(
    new THREE.BoxGeometry(
        2.5,
        3.5,
        .3
    ),
    new THREE.MeshStandardMaterial({
        color: 0x292929
    })
);

exit.position.set(
    -60,
    1.75,
    -24
);

scene.add(exit);

const exitText = new THREE.Mesh(
    new THREE.PlaneGeometry(
        2,
        .5
    ),
    new THREE.MeshBasicMaterial({
        color: 0xff3333
    })
);

exitText.position.set(
    -60,
    3.6,
    -23.8
);

scene.add(exitText);

/* --------------------------------------------------
   MONSTER
-------------------------------------------------- */

const monster = new THREE.Group();

const monsterBody = new THREE.Mesh(
    new THREE.BoxGeometry(
        1.2,
        2.8,
        .8
    ),
    new THREE.MeshStandardMaterial({
        color: 0x080808
    })
);

monsterBody.position.y = 1.4;

monster.add(monsterBody);

const eyeMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xff0000
    });

const eye1 = new THREE.Mesh(
    new THREE.SphereGeometry(.09),
    eyeMaterial
);

const eye2 = eye1.clone();

eye1.position.set(
    -.2,
    2.1,
    -.4
);

eye2.position.set(
    .2,
    2.1,
    -.4
);

monster.add(
    eye1,
    eye2
);

monster.position.set(
    -18,
    0,
    -18
);

scene.add(monster);

/* --------------------------------------------------
   PLAYER
-------------------------------------------------- */

const player = {
    position: new THREE.Vector3(
        -42,
        1.6,
        42
    )
};

camera.position.copy(
    player.position
);

/* --------------------------------------------------
   COLLISION
-------------------------------------------------- */

function collides(pos) {

    const radius = .45;

    for (const wall of walls) {

        const box = new THREE.Box3()
            .setFromObject(wall);

        if (
            pos.x > box.min.x - radius &&
            pos.x < box.max.x + radius &&
            pos.z > box.min.z - radius &&
            pos.z < box.max.z + radius
        ) {

            return true;

        }

    }

    return false;
}

/* --------------------------------------------------
   INPUT
-------------------------------------------------- */

document.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if (
            e.code === "KeyF" &&
            !e.repeat
        ) {

            flashlightOn =
                !flashlightOn;

            flashlight.visible =
                flashlightOn;

            document.getElementById(
                "flashlightText"
            ).textContent =
                flashlightOn
                ? "FLASHLIGHT: ON"
                : "FLASHLIGHT: OFF";

        }

    }
);

document.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);

/* Mouse */

document.addEventListener(
    "mousemove",
    e => {

        if (!canLook)
            return;

        yaw -= e.movementX * .002;
        pitch -= e.movementY * .002;

        pitch = Math.max(
            -Math.PI / 2,
            Math.min(
                Math.PI / 2,
                pitch
            )
        );

        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    () => {

        if (!gameEnded) {

            renderer.domElement
                .requestPointerLock();

        }

    }
);

document.addEventListener(
    "pointerlockchange",
    () => {

        canLook =
            document.pointerLockElement ===
            renderer.domElement;

    }
);

/* --------------------------------------------------
   NETWORK
-------------------------------------------------- */

function connectServer() {

    ws = new WebSocket(SERVER);

    ws.onopen = () => {

        connected = true;

        ws.send(JSON.stringify({
            type: "gameJoin",
            token: sessionToken,
            code: partyCode,
            name: playerName
        }));

    };

    ws.onclose = () => {

        connected = false;

        if (!gameEnded) {

            setTimeout(
                connectServer,
                2000
            );

        }

    };

    ws.onmessage = event => {

        let data;

        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        handleNetwork(data);

    };

}

function handleNetwork(data) {

    if (data.type === "gameJoined") {

        keyCollected =
            data.keyCollected;

        updateObjective();

        return;
    }

    if (data.type === "players") {

        updateRemotePlayers(
            data.players
        );

        return;
    }

    if (data.type === "keyCollected") {

        keyCollected = true;

        key.visible = false;

        updateObjective();

        return;
    }

    if (data.type === "gameWon") {

        finishGame(
            true,
            data.name || "Someone"
        );

        return;
    }

    if (data.type === "gameOver") {

        finishGame(
            false,
            data.name || ""
        );

        return;
    }

}

/* --------------------------------------------------
   REMOTE PLAYERS
-------------------------------------------------- */

function makeRemotePlayer(name) {

    const group = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .45,
            1.1,
            6,
            12
        ),
        new THREE.MeshStandardMaterial({
            color: 0x4b8bc4
        })
    );

    body.position.y = 1.1;

    group.add(body);

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "white";
    ctx.font = "bold 44px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        name,
        256,
        65
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const label = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        })
    );

    label.scale.set(
        3.5,
        .9,
        1
    );

    label.position.y = 2.8;

    group.add(label);

    scene.add(group);

    return group;
}

function updateRemotePlayers(players) {

    const current = new Set();

    for (const p of players) {

        if (p.id === sessionToken)
            continue;

        current.add(p.id);

        if (!remotePlayers.has(p.id)) {

            remotePlayers.set(
                p.id,
                {
                    mesh: makeRemotePlayer(
                        p.name
                    ),
                    target:
                        new THREE.Vector3()
                }
            );

        }

        const remote =
            remotePlayers.get(p.id);

        remote.target.set(
            p.x,
            p.y,
            p.z
        );

    }

    for (
        const [id, remote]
        of remotePlayers
    ) {

        if (!current.has(id)) {

            scene.remove(
                remote.mesh
            );

            remotePlayers.delete(id);

        }

    }

    document.getElementById(
        "playersHUD"
    ).innerHTML =
        `<div>PLAYERS: ${players.length}</div>`;

}

/* --------------------------------------------------
   OBJECTIVE
-------------------------------------------------- */

function updateObjective() {

    const objective =
        document.getElementById(
            "objective"
        );

    if (!keyCollected) {

        objective.textContent =
            "FIND THE KEY";

    } else {

        objective.textContent =
            "THE EXIT IS OPEN";

    }

}

/* --------------------------------------------------
   GAMEPLAY
-------------------------------------------------- */

function updatePlayer(delta) {

    if (gameEnded)
        return;

    const moving =
        keys.KeyW ||
        keys.KeyA ||
        keys.KeyS ||
        keys.KeyD;

    let sprinting =
        keys.ShiftLeft ||
        keys.ShiftRight;

    if (
        stamina <= 0
    ) {

        sprinting = false;

    }

    const speed =
        sprinting
        ? 8
        : 4.5;

    if (moving && sprinting) {

        stamina -= 30 * delta;

    } else {

        stamina += 18 * delta;

    }

    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );

    const direction =
        new THREE.Vector3();

    if (keys.KeyW)
        direction.z -= 1;

    if (keys.KeyS)
        direction.z += 1;

    if (keys.KeyA)
        direction.x -= 1;

    if (keys.KeyD)
        direction.x += 1;

    if (direction.lengthSq() > 0) {

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

        const movement =
            direction.multiplyScalar(
                speed * delta
            );

        const nextX =
            player.position.clone();

        nextX.x += movement.x;

        if (!collides(nextX))
            player.position.x =
                nextX.x;

        const nextZ =
            player.position.clone();

        nextZ.z += movement.z;

        if (!collides(nextZ))
            player.position.z =
                nextZ.z;

    }

    camera.position.copy(
        player.position
    );

    document.getElementById(
        "health"
    ).style.width =
        health + "%";

    document.getElementById(
        "stamina"
    ).style.width =
        stamina + "%";

}

/* --------------------------------------------------
   KEY / EXIT
-------------------------------------------------- */

function checkObjects() {

    if (
        !keyCollected &&
        player.position.distanceTo(
            key.position
        ) < 2
    ) {

        if (connected) {

            ws.send(JSON.stringify({
                type: "collectKey"
            }));

        }

    }

    if (
        keyCollected &&
        player.position.distanceTo(
            exit.position
        ) < 3
    ) {

        if (connected) {

            ws.send(JSON.stringify({
                type: "gameWon"
            }));

        }

    }

}

/* --------------------------------------------------
   MONSTER
-------------------------------------------------- */

function updateMonster(delta) {

    if (gameEnded)
        return;

    const distance =
        monster.position.distanceTo(
            player.position
        );

    if (distance < 35) {

        const direction =
            new THREE.Vector3()
                .subVectors(
                    player.position,
                    monster.position
                );

        direction.y = 0;

        if (direction.lengthSq() > 0) {

            direction.normalize();

            const speed =
                distance < 12
                ? 2.7
                : 1.6;

            monster.position.add(
                direction.multiplyScalar(
                    speed * delta
                )
            );

            monster.lookAt(
                player.position.x,
                monster.position.y,
                player.position.z
            );

        }

    }

    if (
        distance < 1.7 &&
        damageCooldown <= 0
    ) {

        health -= 12;

        damageCooldown = 1;

        if (health <= 0) {

            health = 0;

            if (connected) {

                ws.send(JSON.stringify({
                    type: "gameOver"
                }));

            }

        }

    }

}

/* --------------------------------------------------
   NETWORK POSITION
-------------------------------------------------- */

function sendPosition() {

    if (!connected)
        return;

    const now =
        performance.now();

    if (
        now - lastSent < 80
    )
        return;

    lastSent = now;

    ws.send(JSON.stringify({
        type: "playerUpdate",
        x: player.position.x,
        y: player.position.y,
        z: player.position.z
    }));

}

/* --------------------------------------------------
   END GAME
-------------------------------------------------- */

function finishGame(won, name) {

    if (gameEnded)
        return;

    gameEnded = true;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();

    }

    document.getElementById(
        "endScreen"
    ).classList.remove("hidden");

    const title =
        document.getElementById(
            "endTitle"
        );

    const text =
        document.getElementById(
            "endText"
        );

    if (won) {

        title.textContent =
            "YOU ESCAPED";

        text.textContent =
            name
            ? `${name} found the exit. You escaped the Backrooms.`
            : "You escaped the Backrooms.";

    } else {

        title.textContent =
            "YOU DIED";

        text.textContent =
            "Something found you.";

    }

}

/* --------------------------------------------------
   START
-------------------------------------------------- */

document.getElementById(
    "playButton"
).onclick = () => {

    document.getElementById(
        "startScreen"
    ).classList.add("hidden");

    renderer.domElement.requestPointerLock();

};

connectServer();

/* --------------------------------------------------
   ANIMATION
-------------------------------------------------- */

function animate() {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    damageCooldown -= delta;

    updatePlayer(delta);

    checkObjects();

    updateMonster(delta);

    sendPosition();

    for (
        const remote
        of remotePlayers.values()
    ) {

        remote.mesh.position.lerp(
            remote.target,
            .15
        );

    }

    key.rotation.y +=
        delta * 2;

    renderer.render(
        scene,
        camera
    );

}

animate();

/* --------------------------------------------------
   RESIZE
-------------------------------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
