<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #11100a;
    color: #fff;
}

body {
    background:
        linear-gradient(rgba(40,35,10,.15), rgba(40,35,10,.35)),
        repeating-linear-gradient(
            90deg,
            #a9a35b 0px,
            #aaa45e 80px,
            #9f9954 160px
        );
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.center {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.panel {
    width: 460px;
    max-width: 100%;
    padding: 38px;
    background: rgba(20,18,7,.88);
    border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 70px rgba(0,0,0,.55);
    text-align: center;
    backdrop-filter: blur(4px);
}

h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 7px;
    color: #ddd78b;
    text-shadow: 0 0 15px rgba(255,240,100,.25);
}

.subtitle {
    margin: 8px 0 30px;
    color: #aaa;
    letter-spacing: 3px;
    font-size: 12px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #77704a;
    background: #16150d;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #d4c965;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: 0;
    background: #b9ae57;
    color: #15140b;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    background: #d8cc6b;
    transform: translateY(-1px);
}

button.secondary {
    background: #383621;
    color: #ddd;
}

button.secondary:hover {
    background: #4b482b;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

.hidden {
    display: none !important;
}

.code {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 10px;
    color: #eee9a3;
    margin: 15px 0 5px;
}

.small {
    color: #999;
    font-size: 13px;
}

.players {
    margin: 25px 0;
    text-align: left;
}

.player {
    display: flex;
    justify-content: space-between;
    padding: 11px 12px;
    margin-bottom: 5px;
    background: rgba(255,255,255,.05);
}

.host {
    color: #e6d96e;
}

#error {
    color: #ff7777;
    min-height: 20px;
    margin-top: 12px;
    font-size: 14px;
}

#partyError {
    color: #ff7777;
    min-height: 20px;
    margin-top: 12px;
    font-size: 14px;
}

.status {
    margin-top: 15px;
    font-size: 12px;
    color: #777;
}

#startBtn {
    display: none;
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="center">

    <div class="panel" id="menu">

        <h1>THE BACKROOMS</h1>

        <div class="subtitle">
            THERE IS NO EXIT
        </div>

        <input
            id="name"
            maxlength="16"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <button id="createBtn">
            CREATE PARTY
        </button>

        <button id="joinBtn" class="secondary">
            JOIN PARTY
        </button>

        <div id="joinBox" class="hidden">

            <input
                id="codeInput"
                maxlength="5"
                placeholder="PARTY CODE"
                style="text-transform:uppercase"
                autocomplete="off"
            >

            <button id="joinConfirm">
                JOIN
            </button>

        </div>

        <div id="error"></div>

        <div class="status" id="connectionStatus">
            Connecting...
        </div>

    </div>


    <div class="panel hidden" id="party">

        <div class="small">
            PARTY CODE
        </div>

        <div class="code" id="partyCode">
            -----
        </div>

        <div class="small">
            Give this code to your friends.
        </div>

        <div class="players" id="players"></div>

        <button id="startBtn">
            START GAME
        </button>

        <button id="leaveBtn" class="secondary">
            LEAVE PARTY
        </button>

        <div id="partyError"></div>

    </div>

</div>


<script>

const SERVER =
    "wss://backrooms-avnx.onrender.com";

let ws = null;

let playerName =
    localStorage.getItem("playerName") || "";

let sessionToken =
    localStorage.getItem("backroomsSession") || "";

let partyCode =
    localStorage.getItem("partyCode") || "";

let isHost = false;

let reconnectTimer = null;

let leaving = false;


/* ELEMENTS */

const menu =
    document.getElementById("menu");

const party =
    document.getElementById("party");

const nameInput =
    document.getElementById("name");

const codeInput =
    document.getElementById("codeInput");

const joinBox =
    document.getElementById("joinBox");

const error =
    document.getElementById("error");

const partyError =
    document.getElementById("partyError");

const connectionStatus =
    document.getElementById("connectionStatus");

const partyCodeElement =
    document.getElementById("partyCode");

const playersElement =
    document.getElementById("players");

const startBtn =
    document.getElementById("startBtn");

const leaveBtn =
    document.getElementById("leaveBtn");


nameInput.value =
    playerName;


/* CONNECT */

function connect() {

    if (
        ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    connectionStatus.textContent =
        "Connecting...";

    ws =
        new WebSocket(SERVER);


    ws.onopen = () => {

        connectionStatus.textContent =
            "CONNECTED";


        /*
         * Only attempt reconnect if we actually
         * have a saved party session.
         */

        if (
            sessionToken &&
            partyCode
        ) {

            send({
                type: "reconnect",
                token: sessionToken,
                code: partyCode,
                name: playerName
            });

        }

    };


    ws.onmessage = event => {

        let data;

        try {

            data =
                JSON.parse(
                    event.data
                );

        } catch {

            return;

        }

        handleMessage(data);

    };


    ws.onerror = () => {

        connectionStatus.textContent =
            "CONNECTION ERROR";

    };


    ws.onclose = () => {

        connectionStatus.textContent =
            "DISCONNECTED";

        if (!leaving) {

            clearTimeout(
                reconnectTimer
            );

            reconnectTimer =
                setTimeout(
                    connect,
                    2500
                );

        }

    };

}


/* SEND */

function send(data) {

    if (
        ws &&
        ws.readyState ===
            WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

        return true;

    }

    return false;

}


/* SERVER MESSAGES */

function handleMessage(data) {


    /* SESSION */

    if (
        data.type ===
        "session"
    ) {

        sessionToken =
            data.token;

        localStorage.setItem(
            "backroomsSession",
            sessionToken
        );

        return;
    }


    /* PARTY CREATED */

    if (
        data.type ===
        "partyCreated"
    ) {

        partyCode =
            data.code;

        isHost =
            true;

        localStorage.setItem(
            "partyCode",
            partyCode
        );

        showParty();


        /*
         * HOST GETS START GAME.
         */
        startBtn.style.display =
            "block";

        startBtn.disabled =
            false;

        startBtn.textContent =
            "START GAME";

        return;
    }


    /* PARTY JOINED */

    if (
        data.type ===
        "partyJoined"
    ) {

        partyCode =
            data.code;

        isHost =
            data.host === true;

        localStorage.setItem(
            "partyCode",
            partyCode
        );

        showParty();


        if (isHost) {

            startBtn.style.display =
                "block";

        } else {

            startBtn.style.display =
                "none";

        }

        return;
    }


    /* LOBBY */

    if (
        data.type ===
        "lobby"
    ) {

        if (data.code) {

            partyCode =
                data.code;

            partyCodeElement.textContent =
                data.code;

        }


        updatePlayers(
            data.players || []
        );


        /*
         * Explicit host information.
         */

        if (
            data.youAreHost === true
        ) {

            isHost =
                true;

        }


        /*
         * Compatibility with older server.
         */

        if (
            data.host &&
            data.host ===
                sessionToken
        ) {

            isHost =
                true;

        }


        if (isHost) {

            startBtn.style.display =
                "block";

            startBtn.disabled =
                false;

            startBtn.textContent =
                "START GAME";

        } else {

            startBtn.style.display =
                "none";

        }

        return;
    }


    /* GAME STARTED */

    if (
        data.type ===
        "gameStarted"
    ) {

        goToGame();

        return;
    }


    /* ERROR */

    if (
        data.type ===
        "error"
    ) {

        const message =
            data.message ||
            "Something went wrong.";

        if (
            party.classList.contains(
                "hidden"
            )
        ) {

            error.textContent =
                message;

        } else {

            partyError.textContent =
                message;

        }

        return;
    }

}


/* SHOW PARTY */

function showParty() {

    menu.classList.add(
        "hidden"
    );

    party.classList.remove(
        "hidden"
    );

    partyCodeElement.textContent =
        partyCode;

}


/* GO TO GAME */

function goToGame() {

    if (
        !partyCode ||
        !sessionToken
    ) {

        partyError.textContent =
            "Missing party connection.";

        return;

    }


    /*
     * Pass the session token directly into
     * game.html.
     */

    const url =
        "game.html?party=" +
        encodeURIComponent(
            partyCode
        ) +
        "&token=" +
        encodeURIComponent(
            sessionToken
        );


    window.location.href =
        url;

}


/* PLAYERS */

function updatePlayers(
    players
) {

    playersElement.innerHTML =
        "";


    players.forEach(
        (p, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "player";


            const name =
                document.createElement(
                    "span"
                );

            name.textContent =
                p.name ||
                "Player";


            const role =
                document.createElement(
                    "span"
                );


            if (
                p.id ===
                sessionToken
            ) {

                role.textContent =
                    "YOU";

                role.className =
                    "host";

            } else if (
                p.host
            ) {

                role.textContent =
                    "HOST";

                role.className =
                    "host";

            } else {

                role.textContent =
                    "PLAYER " +
                    (index + 1);

            }


            row.appendChild(
                name
            );

            row.appendChild(
                role
            );


            playersElement.appendChild(
                row
            );

        }
    );

}


/* CREATE PARTY */

document.getElementById(
    "createBtn"
).onclick = () => {

    error.textContent =
        "";

    const name =
        nameInput.value
            .trim()
            .slice(
                0,
                16
            );


    if (!name) {

        error.textContent =
            "Enter your name first.";

        return;

    }


    if (
        !ws ||
        ws.readyState !==
            WebSocket.OPEN
    ) {

        error.textContent =
            "Still connecting to server...";

        return;

    }


    playerName =
        name;


    localStorage.setItem(
        "playerName",
        playerName
    );


    /*
     * Creating a party makes this
     * browser the host.
     */

    isHost =
        true;


    send({
        type:
            "createParty",

        name:
            playerName
    });

};


/* JOIN BUTTON */

document.getElementById(
    "joinBtn"
).onclick = () => {

    joinBox.classList.remove(
        "hidden"
    );

    codeInput.focus();

};


/* JOIN PARTY */

document.getElementById(
    "joinConfirm"
).onclick = () => {

    error.textContent =
        "";

    const name =
        nameInput.value
            .trim()
            .slice(
                0,
                16
            );


    const code =
        codeInput.value
            .trim()
            .toUpperCase();


    if (!name) {

        error.textContent =
            "Enter your name first.";

        return;

    }


    if (
        code.length !== 5
    ) {

        error.textContent =
            "Party codes are 5 characters.";

        return;

    }


    if (
        !ws ||
        ws.readyState !==
            WebSocket.OPEN
    ) {

        error.textContent =
            "Still connecting to server...";

        return;

    }


    playerName =
        name;


    isHost =
        false;


    localStorage.setItem(
        "playerName",
        playerName
    );


    send({

        type:
            "joinParty",

        name:
            playerName,

        code:
            code

    });

};


/* START GAME */

startBtn.onclick = () => {

    partyError.textContent =
        "";


    if (!isHost) {

        partyError.textContent =
            "Only the host can start the game.";

        return;

    }


    if (
        !ws ||
        ws.readyState !==
            WebSocket.OPEN
    ) {

        partyError.textContent =
            "Not connected to server.";

        return;

    }


    startBtn.disabled =
        true;

    startBtn.textContent =
        "STARTING...";


    /*
     * SERVER will send gameStarted
     * to every person in the party.
     */
    send({
        type:
            "startGame"
    });

};


/* LEAVE */

leaveBtn.onclick = () => {

    leaving =
        true;


    clearTimeout(
        reconnectTimer
    );


    localStorage.removeItem(
        "playerName"
    );

    localStorage.removeItem(
        "backroomsSession"
    );

    localStorage.removeItem(
        "partyCode"
    );


    if (ws) {

        ws.close();

    }


    window.location.href =
        "index.html";

};


/* START */

connect();

</script>

</body>
</html>
