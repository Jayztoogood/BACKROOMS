<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #11100a;
    color: #fff;
}

body {
    background:
        linear-gradient(rgba(40,35,10,.15), rgba(40,35,10,.35)),
        repeating-linear-gradient(
            90deg,
            #a9a35b 0px,
            #aaa45e 80px,
            #9f9954 160px
        );
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.center {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.panel {
    width: 460px;
    max-width: 100%;
    padding: 38px;
    background: rgba(20,18,7,.88);
    border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 70px rgba(0,0,0,.55);
    text-align: center;
    backdrop-filter: blur(4px);
}

h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 7px;
    color: #ddd78b;
    text-shadow: 0 0 15px rgba(255,240,100,.25);
}

.subtitle {
    margin: 8px 0 30px;
    color: #aaa;
    letter-spacing: 3px;
    font-size: 12px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #77704a;
    background: #16150d;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #d4c965;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: 0;
    background: #b9ae57;
    color: #15140b;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    background: #d8cc6b;
    transform: translateY(-1px);
}

button.secondary {
    background: #383621;
    color: #ddd;
}

button.secondary:hover {
    background: #4b482b;
}

.hidden {
    display: none !important;
}

.code {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 10px;
    color: #eee9a3;
    margin: 15px 0 5px;
}

.small {
    color: #999;
    font-size: 13px;
}

.players {
    margin: 25px 0;
    text-align: left;
}

.player {
    display: flex;
    justify-content: space-between;
    padding: 11px 12px;
    margin-bottom: 5px;
    background: rgba(255,255,255,.05);
}

.host {
    color: #e6d96e;
}

#error {
    color: #ff7777;
    min-height: 20px;
    margin-top: 12px;
    font-size: 14px;
}

.status {
    margin-top: 15px;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="center">

    <!-- MAIN MENU -->
    <div class="panel" id="menu">

        <h1>THE BACKROOMS</h1>

        <div class="subtitle">
            THERE IS NO EXIT
        </div>

        <input
            id="name"
            maxlength="16"
            placeholder="Enter your name"
        >

        <button id="createBtn">
            CREATE PARTY
        </button>

        <button id="joinBtn" class="secondary">
            JOIN PARTY
        </button>

        <div id="joinBox" class="hidden">

            <input
                id="codeInput"
                maxlength="5"
                placeholder="PARTY CODE"
                style="text-transform:uppercase"
            >

            <button id="joinConfirm">
                JOIN
            </button>

        </div>

        <div id="error"></div>

        <div class="status" id="connectionStatus">
            Connecting...
        </div>

    </div>


    <!-- PARTY -->
    <div class="panel hidden" id="party">

        <div class="small">
            PARTY CODE
        </div>

        <div class="code" id="partyCode">
            -----
        </div>

        <div class="small">
            Give this code to your friends.
        </div>

        <div class="players" id="players"></div>

        <!-- HOST ONLY -->
        <button id="startBtn" style="display:none;">
            START GAME
        </button>

        <button id="leaveBtn" class="secondary">
            LEAVE PARTY
        </button>

        <div id="partyError"></div>

    </div>

</div>


<script>

const SERVER =
    "wss://backrooms-avnx.onrender.com";

let ws = null;

let playerName =
    localStorage.getItem("playerName") || "";

let sessionToken =
    localStorage.getItem("backroomsSession") || "";

let partyCode =
    localStorage.getItem("partyCode") || "";


const menu =
    document.getElementById("menu");

const party =
    document.getElementById("party");

const nameInput =
    document.getElementById("name");

const codeInput =
    document.getElementById("codeInput");

const error =
    document.getElementById("error");

const partyError =
    document.getElementById("partyError");

const connectionStatus =
    document.getElementById("connectionStatus");

const startBtn =
    document.getElementById("startBtn");

const playersContainer =
    document.getElementById("players");


nameInput.value =
    playerName;


/* -----------------------------------------
   CONNECT
----------------------------------------- */

function connect() {

    ws = new WebSocket(SERVER);

    ws.onopen = () => {

        connectionStatus.textContent =
            "CONNECTED";

        /*
         * Reconnect to existing party
         * if we already have a session.
         */

        if (
            sessionToken &&
            partyCode
        ) {

            ws.send(JSON.stringify({
                type: "reconnect",
                token: sessionToken,
                code: partyCode,
                name: playerName
            }));

        }

    };


    ws.onclose = () => {

        connectionStatus.textContent =
            "DISCONNECTED";

        setTimeout(
            connect,
            2500
        );

    };


    ws.onerror = () => {

        connectionStatus.textContent =
            "CONNECTION ERROR";

    };


    ws.onmessage = event => {

        let data;

        try {

            data =
                JSON.parse(event.data);

        } catch {

            return;

        }

        handleMessage(data);

    };

}


/* -----------------------------------------
   HANDLE SERVER MESSAGE
----------------------------------------- */

function handleMessage(data) {


    /* SESSION */

    if (
        data.type === "session"
    ) {

        sessionToken =
            data.token;

        localStorage.setItem(
            "backroomsSession",
            sessionToken
        );

        return;
    }


    /* PARTY CREATED */

    if (
        data.type === "partyCreated"
    ) {

        partyCode =
            data.code;

        localStorage.setItem(
            "partyCode",
            partyCode
        );

        showParty();

        return;
    }


    /* PARTY JOINED */

    if (
        data.type === "partyJoined"
    ) {

        partyCode =
            data.code;

        localStorage.setItem(
            "partyCode",
            partyCode
        );

        showParty();

        return;
    }


    /* LOBBY */

    if (
        data.type === "lobby"
    ) {

        updatePlayers(
            data.players || []
        );


        /*
         * FIX:
         *
         * Check BOTH the server host ID
         * and the player object.
         *
         * This makes sure the host sees
         * START GAME.
         */

        const me =
            (data.players || []).find(
                p => p.id === sessionToken
            );


        const amHost =
            data.host === sessionToken ||
            (
                me &&
                me.host === true
            );


        if (amHost) {

            startBtn.style.display =
                "block";

        } else {

            startBtn.style.display =
                "none";

        }

        return;
    }


    /* GAME STARTED */

    if (
        data.type === "gameStarted"
    ) {

        window.location.href =
            "game.html?party=" +
            encodeURIComponent(
                partyCode
            );

        return;
    }


    /* ERROR */

    if (
        data.type === "error"
    ) {

        error.textContent =
            data.message || "";

        partyError.textContent =
            data.message || "";

        return;
    }

}


/* -----------------------------------------
   SHOW PARTY
----------------------------------------- */

function showParty() {

    menu.classList.add(
        "hidden"
    );

    party.classList.remove(
        "hidden"
    );

    document.getElementById(
        "partyCode"
    ).textContent =
        partyCode;

    /*
     * Wait for the lobby message
     * to determine whether we're host.
     */

    startBtn.style.display =
        "none";

}


/* -----------------------------------------
   UPDATE PLAYERS
----------------------------------------- */

function updatePlayers(
    players
) {

    playersContainer.innerHTML =
        "";


    players.forEach(
        (p, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "player";


            let label;


            if (
                p.id === sessionToken
            ) {

                label =
                    `<span class="host">YOU</span>`;

            } else if (
                p.host
            ) {

                label =
                    `<span class="host">HOST</span>`;

            } else {

                label =
                    `<span>PLAYER ${index + 1}</span>`;

            }


            div.innerHTML = `
                <span>
                    ${escapeHTML(p.name)}
                </span>

                ${label}
            `;


            playersContainer.appendChild(
                div
            );

        }
    );

}


/* -----------------------------------------
   ESCAPE HTML
----------------------------------------- */

function escapeHTML(
    text
) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* -----------------------------------------
   CREATE PARTY
----------------------------------------- */

document.getElementById(
    "createBtn"
).onclick = () => {

    const name =
        nameInput.value.trim();


    if (!name) {

        error.textContent =
            "Enter your name first.";

        return;

    }


    playerName =
        name;


    localStorage.setItem(
        "playerName",
        playerName
    );


    error.textContent =
        "";


    if (
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ) {

        error.textContent =
            "Still connecting to server...";

        return;

    }


    ws.send(
        JSON.stringify({
            type: "createParty",
            name: playerName
        })
    );

};


/* -----------------------------------------
   JOIN PARTY BUTTON
----------------------------------------- */

document.getElementById(
    "joinBtn"
).onclick = () => {

    document.getElementById(
        "joinBox"
    ).classList.remove(
        "hidden"
    );

};


/* -----------------------------------------
   JOIN PARTY
----------------------------------------- */

document.getElementById(
    "joinConfirm"
).onclick = () => {

    const name =
        nameInput.value.trim();

    const code =
        codeInput.value
            .trim()
            .toUpperCase();


    if (!name) {

        error.textContent =
            "Enter your name first.";

        return;

    }


    if (
        code.length !== 5
    ) {

        error.textContent =
            "Party codes are 5 characters.";

        return;

    }


    playerName =
        name;


    localStorage.setItem(
        "playerName",
        playerName
    );


    error.textContent =
        "";


    if (
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ) {

        error.textContent =
            "Still connecting to server...";

        return;

    }


    ws.send(
        JSON.stringify({
            type: "joinParty",
            name: playerName,
            code: code
        })
    );

};


/* -----------------------------------------
   START GAME
----------------------------------------- */

startBtn.onclick = () => {

    partyError.textContent =
        "";


    if (
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ) {

        partyError.textContent =
            "Not connected to server.";

        return;

    }


    ws.send(
        JSON.stringify({
            type: "startGame"
        })
    );

};


/* -----------------------------------------
   LEAVE PARTY
----------------------------------------- */

document.getElementById(
    "leaveBtn"
).onclick = () => {

    localStorage.removeItem(
        "partyCode"
    );

    partyCode =
        "";

    location.reload();

};


/* -----------------------------------------
   START CONNECTION
----------------------------------------- */

connect();

</script>

</body>
</html>
