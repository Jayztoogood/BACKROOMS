<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

body{
    background:
        linear-gradient(rgba(40,35,10,.15),rgba(40,35,10,.35)),
        repeating-linear-gradient(
            90deg,
            #a9a35b 0,
            #aaa45e 80px,
            #9f9954 160px
        );
}

.noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.center{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.panel{
    width:460px;
    max-width:100%;
    padding:38px;
    background:rgba(20,18,7,.90);
    border:2px solid rgba(255,255,255,.12);
    box-shadow:0 20px 70px rgba(0,0,0,.55);
    text-align:center;
    backdrop-filter:blur(4px);
}

h1{
    margin:0;
    font-size:52px;
    letter-spacing:7px;
    color:#ddd78b;
}

.subtitle{
    margin:8px 0 30px;
    color:#aaa;
    letter-spacing:3px;
    font-size:12px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border:1px solid #77704a;
    background:#16150d;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#d4c965;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    background:#b9ae57;
    color:#15140b;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#d8cc6b;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

button.secondary{
    background:#383621;
    color:#ddd;
}

button.secondary:hover{
    background:#4b482b;
}

.hidden{
    display:none!important;
}

.code{
    font-size:42px;
    font-weight:bold;
    letter-spacing:10px;
    color:#eee9a3;
    margin:15px 0 5px;
}

.small{
    color:#999;
    font-size:13px;
}

.players{
    margin:25px 0;
    text-align:left;
}

.player{
    display:flex;
    justify-content:space-between;
    padding:11px 12px;
    margin-bottom:5px;
    background:rgba(255,255,255,.05);
}

.host{
    color:#e6d96e;
}

#error,#partyError{
    color:#ff7777;
    min-height:20px;
    margin-top:12px;
    font-size:14px;
}

.status{
    margin-top:15px;
    font-size:12px;
    color:#777;
}

#startBtn{
    display:none;
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="center">

    <div class="panel" id="menu">

        <h1>THE BACKROOMS</h1>

        <div class="subtitle">
            THERE IS NO EXIT
        </div>

        <input
            id="name"
            maxlength="16"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <button id="createBtn">
            CREATE PARTY
        </button>

        <button
            id="joinBtn"
            class="secondary"
        >
            JOIN PARTY
        </button>

        <div
            id="joinBox"
            class="hidden"
        >

            <input
                id="codeInput"
                maxlength="5"
                placeholder="PARTY CODE"
                autocomplete="off"
            >

            <button id="joinConfirm">
                JOIN
            </button>

        </div>

        <div id="error"></div>

        <div
            class="status"
            id="connectionStatus"
        >
            CONNECTING...
        </div>

    </div>


    <div
        class="panel hidden"
        id="party"
    >

        <div class="small">
            PARTY CODE
        </div>

        <div
            class="code"
            id="partyCode"
        >
            -----
        </div>

        <div class="small">
            Give this code to your friends.
        </div>

        <div
            class="players"
            id="players"
        ></div>

        <button id="startBtn">
            START GAME
        </button>

        <button
            id="leaveBtn"
            class="secondary"
        >
            LEAVE PARTY
        </button>

        <div id="partyError"></div>

    </div>

</div>


<script>

const SERVER =
    "wss://backrooms-avnx.onrender.com";

let ws = null;

let playerName =
    localStorage.getItem("playerName") || "";

let sessionToken =
    localStorage.getItem("backroomsSession") || "";

let partyCode =
    localStorage.getItem("partyCode") || "";

let isHost = false;

let leaving = false;

let gameStarting = false;

let partyCheckTimer = null;


/* ELEMENTS */

const menu =
    document.getElementById("menu");

const party =
    document.getElementById("party");

const nameInput =
    document.getElementById("name");

const codeInput =
    document.getElementById("codeInput");

const joinBox =
    document.getElementById("joinBox");

const error =
    document.getElementById("error");

const partyError =
    document.getElementById("partyError");

const connectionStatus =
    document.getElementById("connectionStatus");

const partyCodeElement =
    document.getElementById("partyCode");

const playersElement =
    document.getElementById("players");

const startBtn =
    document.getElementById("startBtn");

const leaveBtn =
    document.getElementById("leaveBtn");


nameInput.value = playerName;


/* SEND */

function send(data){

    if(
        ws &&
        ws.readyState === WebSocket.OPEN
    ){

        ws.send(
            JSON.stringify(data)
        );

        return true;
    }

    return false;
}


/* CONNECT */

function connect(){

    if(
        ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ){
        return;
    }

    connectionStatus.textContent =
        "CONNECTING...";

    try{

        ws =
            new WebSocket(SERVER);

    }catch(error){

        connectionStatus.textContent =
            "CONNECTION FAILED";

        setTimeout(connect,3000);

        return;
    }


    ws.onopen = () => {

        connectionStatus.textContent =
            "CONNECTED";


        if(
            partyCode &&
            sessionToken
        ){

            send({
                type:"reconnect",
                token:sessionToken,
                code:partyCode,
                name:playerName
            });

        }
    };


    ws.onmessage = event => {

        let data;

        try{

            data =
                JSON.parse(event.data);

        }catch{

            return;
        }

        handleMessage(data);
    };


    ws.onerror = () => {

        connectionStatus.textContent =
            "CONNECTION FAILED";
    };


    ws.onclose = () => {

        connectionStatus.textContent =
            "DISCONNECTED";


        if(
            !leaving &&
            !gameStarting
        ){

            setTimeout(
                connect,
                3000
            );
        }
    };
}


/* PARTY CHECK */

function checkParty(){

    if(
        !partyCode ||
        !sessionToken ||
        gameStarting
    ){
        return;
    }

    send({

        type:"checkParty",

        code:partyCode,

        token:sessionToken

    });
}


function startPartyCheck(){

    stopPartyCheck();

    checkParty();

    partyCheckTimer =
        setInterval(
            checkParty,
            1000
        );
}


function stopPartyCheck(){

    if(partyCheckTimer){

        clearInterval(
            partyCheckTimer
        );

        partyCheckTimer =
            null;
    }
}


/* SERVER MESSAGES */

function handleMessage(data){

    if(
        data.type === "session"
    ){

        if(data.token){

            sessionToken =
                data.token;

            localStorage.setItem(
                "backroomsSession",
                sessionToken
            );
        }

        return;
    }


    if(
        data.type === "partyCreated"
    ){

        partyCode =
            data.code;

        if(data.token){

            sessionToken =
                data.token;

            localStorage.setItem(
                "backroomsSession",
                sessionToken
            );
        }

        localStorage.setItem(
            "partyCode",
            partyCode
        );

        isHost = true;

        showParty();

        startBtn.style.display =
            "block";

        startBtn.disabled =
            false;

        startBtn.textContent =
            "START GAME";

        startPartyCheck();

        return;
    }


    if(
        data.type === "partyJoined"
    ){

        partyCode =
            data.code;

        if(data.token){

            sessionToken =
                data.token;

            localStorage.setItem(
                "backroomsSession",
                sessionToken
            );
        }

        localStorage.setItem(
            "partyCode",
            partyCode
        );

        isHost =
            data.host === true;

        showParty();

        if(isHost){

            startBtn.style.display =
                "block";

        }else{

            startBtn.style.display =
                "none";
        }

        startPartyCheck();

        return;
    }


    if(
        data.type === "lobby"
    ){

        if(data.code){

            partyCode =
                data.code;

            partyCodeElement.textContent =
                data.code;
        }

        updatePlayers(
            data.players || []
        );


        isHost =
            data.youAreHost === true;


        if(
            data.host &&
            data.host === sessionToken
        ){

            isHost = true;
        }


        if(isHost){

            startBtn.style.display =
                "block";

            startBtn.disabled =
                false;

            startBtn.textContent =
                "START GAME";

        }else{

            startBtn.style.display =
                "none";
        }

        return;
    }


    if(
        data.type === "partyStatus"
    ){

        if(data.token){

            sessionToken =
                data.token;

            localStorage.setItem(
                "backroomsSession",
                sessionToken
            );
        }


        if(data.code){

            partyCode =
                data.code;

            localStorage.setItem(
                "partyCode",
                partyCode
            );
        }


        if(data.started === true){

            stopPartyCheck();

            goToGame();
        }

        return;
    }


    if(
        data.type === "gameStarted"
    ){

        if(data.token){

            sessionToken =
                data.token;

            localStorage.setItem(
                "backroomsSession",
                sessionToken
            );
        }


        if(data.code){

            partyCode =
                data.code;

            localStorage.setItem(
                "partyCode",
                partyCode
            );
        }


        stopPartyCheck();

        goToGame();

        return;
    }


    if(
        data.type === "error"
    ){

        partyError.textContent =
            data.message ||
            "Something went wrong.";

        gameStarting =
            false;

        startBtn.disabled =
            false;

        startBtn.textContent =
            "START GAME";
    }
}


/* PARTY SCREEN */

function showParty(){

    menu.classList.add(
        "hidden"
    );

    party.classList.remove(
        "hidden"
    );

    partyCodeElement.textContent =
        partyCode;
}


/* GO GAME */

function goToGame(){

    if(!partyCode){

        partyError.textContent =
            "Party code is missing.";

        gameStarting =
            false;

        return;
    }


    if(!sessionToken){

        partyError.textContent =
            "Game session is missing.";

        gameStarting =
            false;

        return;
    }


    gameStarting =
        true;


    stopPartyCheck();


    const url =
        "game.html?party=" +
        encodeURIComponent(partyCode) +
        "&token=" +
        encodeURIComponent(sessionToken);


    window.location.href =
        url;
}


/* PLAYERS */

function updatePlayers(players){

    playersElement.innerHTML = "";


    players.forEach(
        (p,index) => {

            const row =
                document.createElement("div");

            row.className =
                "player";


            const name =
                document.createElement("span");

            name.textContent =
                p.name || "Player";


            const role =
                document.createElement("span");


            if(
                p.id === sessionToken
            ){

                role.textContent =
                    "YOU";

                role.className =
                    "host";

            }else if(
                p.host
            ){

                role.textContent =
                    "HOST";

                role.className =
                    "host";

            }else{

                role.textContent =
                    "PLAYER " +
                    (index + 1);
            }


            row.appendChild(name);

            row.appendChild(role);

            playersElement.appendChild(row);
        }
    );
}


/* CREATE */

document.getElementById(
    "createBtn"
).onclick = () => {

    error.textContent = "";

    const name =
        nameInput.value
            .trim()
            .slice(0,16);


    if(!name){

        error.textContent =
            "Enter your name first.";

        return;
    }


    if(
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ){

        error.textContent =
            "Still connecting to server...";

        return;
    }


    playerName =
        name;


    localStorage.setItem(
        "playerName",
        playerName
    );


    isHost =
        true;


    send({

        type:"createParty",

        name:playerName

    });
};


/* JOIN UI */

document.getElementById(
    "joinBtn"
).onclick = () => {

    error.textContent = "";

    joinBox.classList.remove(
        "hidden"
    );

    codeInput.focus();
};


/* JOIN */

document.getElementById(
    "joinConfirm"
).onclick = () => {

    error.textContent = "";


    const name =
        nameInput.value
            .trim()
            .slice(0,16);


    const code =
        codeInput.value
            .trim()
            .toUpperCase();


    if(!name){

        error.textContent =
            "Enter your name first.";

        return;
    }


    if(code.length !== 5){

        error.textContent =
            "Party codes are 5 characters.";

        return;
    }


    if(
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ){

        error.textContent =
            "Still connecting to server...";

        return;
    }


    playerName =
        name;


    isHost =
        false;


    localStorage.setItem(
        "playerName",
        playerName
    );


    send({

        type:"joinParty",

        name:playerName,

        code:code

    });
};


/* START */

startBtn.onclick = () => {

    partyError.textContent = "";


    if(!isHost){

        partyError.textContent =
            "Only the host can start the game.";

        return;
    }


    if(
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ){

        partyError.textContent =
            "Not connected to server.";

        return;
    }


    gameStarting =
        true;


    startBtn.disabled =
        true;


    startBtn.textContent =
        "STARTING...";


    send({

        type:"startGame"

    });
};


/* LEAVE */

leaveBtn.onclick = () => {

    leaving =
        true;


    stopPartyCheck();


    localStorage.removeItem(
        "playerName"
    );

    localStorage.removeItem(
        "backroomsSession"
    );

    localStorage.removeItem(
        "partyCode"
    );


    if(ws){
        ws.close();
    }


    location.reload();
};


/* ENTER KEY */

nameInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            document
                .getElementById(
                    "createBtn"
                )
                .click();
        }
    }
);


codeInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            document
                .getElementById(
                    "joinConfirm"
                )
                .click();
        }
    }
);


/* CODE */

codeInput.addEventListener(
    "input",
    () => {

        codeInput.value =
            codeInput.value
                .replace(
                    /[^A-Za-z0-9]/g,
                    ""
                )
                .toUpperCase()
                .slice(0,5);

    }
);


/* CONNECT */

connect();

</script>

</body>
</html>
