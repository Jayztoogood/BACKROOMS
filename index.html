<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #d6d08b;
        font-family: Arial, Helvetica, sans-serif;
        color: #252510;
        overflow: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.025) 0px,
                rgba(0,0,0,0.025) 1px,
                transparent 1px,
                transparent 4px
            );
        opacity: 0.7;
    }

    .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.08;
        background-image:
            radial-gradient(#000 1px, transparent 1px);
        background-size: 5px 5px;
    }

    .screen {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .menu {
        width: 430px;
        text-align: center;
    }

    .title {
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 8px;
        margin-bottom: 8px;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }

    .subtitle {
        font-size: 14px;
        letter-spacing: 4px;
        margin-bottom: 35px;
        opacity: 0.7;
    }

    input {
        width: 100%;
        height: 52px;
        border: 2px solid #77723d;
        background: rgba(255,255,210,0.45);
        color: #252510;
        font-size: 18px;
        text-align: center;
        outline: none;
        margin-bottom: 15px;
    }

    input:focus {
        border-color: #403d18;
        background: rgba(255,255,220,0.7);
    }

    button {
        width: 100%;
        height: 52px;
        border: 2px solid #403d18;
        background: #aaa55c;
        color: #17170b;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 3px;
        cursor: pointer;
        margin-bottom: 12px;
        transition: 0.15s;
    }

    button:hover {
        background: #c0bb6e;
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(1px);
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .join-box {
        display: flex;
        gap: 10px;
        margin-top: 5px;
    }

    .join-box input {
        margin: 0;
        flex: 1;
    }

    .join-box button {
        width: 130px;
        margin: 0;
    }

    .status {
        min-height: 24px;
        margin-top: 15px;
        font-size: 13px;
        letter-spacing: 1px;
        opacity: 0.8;
    }

    .hidden {
        display: none !important;
    }

    /* PARTY SCREEN */

    .party {
        width: 500px;
        text-align: center;
    }

    .party-title {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 6px;
        margin-bottom: 25px;
    }

    .code-label {
        font-size: 12px;
        letter-spacing: 3px;
        opacity: 0.7;
        margin-bottom: 5px;
    }

    .party-code {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 10px;
        margin-bottom: 25px;
    }

    .players-box {
        border: 2px solid #77723d;
        background: rgba(255,255,210,0.3);
        padding: 15px;
        margin-bottom: 15px;
        text-align: left;
    }

    .players-header {
        font-size: 12px;
        letter-spacing: 3px;
        opacity: 0.7;
        margin-bottom: 10px;
    }

    .player {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 5px;
        border-bottom: 1px solid rgba(60,60,20,0.2);
        font-size: 16px;
    }

    .player:last-child {
        border-bottom: none;
    }

    .host {
        font-size: 11px;
        letter-spacing: 2px;
        opacity: 0.7;
    }

    #startBtn {
        display: none;
    }

    .leave-btn {
        background: transparent;
        border-color: #77723d;
        font-size: 13px;
    }

    .leave-btn:hover {
        background: rgba(120,110,50,0.15);
    }

    @media (max-width: 600px) {
        .menu,
        .party {
            width: 90%;
        }

        .title {
            font-size: 34px;
            letter-spacing: 5px;
        }

        .party-title {
            font-size: 25px;
        }
    }
</style>
</head>

<body>

<div class="noise"></div>

<!-- MAIN MENU -->
<div id="menuScreen" class="screen">
    <div class="menu">

        <div class="title">THE BACKROOMS</div>
        <div class="subtitle">NO CLIP. NO ESCAPE.</div>

        <input
            id="nameInput"
            type="text"
            maxlength="16"
            placeholder="ENTER YOUR NAME"
        >

        <button id="createBtn">CREATE PARTY</button>

        <div class="join-box">
            <input
                id="codeInput"
                type="text"
                maxlength="5"
                placeholder="PARTY CODE"
            >
            <button id="joinBtn">JOIN</button>
        </div>

        <div id="status" class="status"></div>

    </div>
</div>


<!-- PARTY SCREEN -->
<div id="partyScreen" class="screen hidden">
    <div class="party">

        <div class="party-title">YOUR PARTY</div>

        <div class="code-label">PARTY CODE</div>
        <div id="partyCode" class="party-code">-----</div>

        <div class="players-box">

            <div class="players-header">
                PLAYERS
            </div>

            <div id="playersList"></div>

        </div>

        <!-- START GAME BUTTON -->
        <button id="startBtn">START GAME</button>

        <button id="leaveBtn" class="leave-btn">
            LEAVE PARTY
        </button>

        <div id="partyStatus" class="status"></div>

    </div>
</div>


<script>

const SERVER = "wss://backrooms-avnx.onrender.com";

let ws = null;
let isHost = false;
let partyCode = "";
let playerName = "";

const menuScreen = document.getElementById("menuScreen");
const partyScreen = document.getElementById("partyScreen");

const nameInput = document.getElementById("nameInput");
const codeInput = document.getElementById("codeInput");

const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");

const startBtn = document.getElementById("startBtn");
const leaveBtn = document.getElementById("leaveBtn");

const status = document.getElementById("status");
const partyStatus = document.getElementById("partyStatus");

const partyCodeDisplay = document.getElementById("partyCode");
const playersList = document.getElementById("playersList");


/* CONNECT */

function connect() {

    if (ws && ws.readyState === WebSocket.OPEN) {
        return;
    }

    ws = new WebSocket(SERVER);

    ws.onopen = () => {
        console.log("Connected to server");
        status.textContent = "CONNECTED";
    };

    ws.onclose = () => {
        console.log("Disconnected");
    };

    ws.onerror = () => {
        status.textContent = "SERVER CONNECTION ERROR";
    };

    ws.onmessage = (event) => {

        let data;

        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        console.log("SERVER:", data);

        /* SESSION */

        if (data.type === "session") {

            localStorage.setItem(
                "backroomsSession",
                data.token
            );

        }


        /* PARTY CREATED */

        if (data.type === "partyCreated") {

            partyCode = data.code;
            isHost = true;

            showParty();

            partyStatus.textContent =
                "WAITING FOR PLAYERS...";

            /*
             * SHOW START GAME BUTTON
             */

            startBtn.style.display = "block";
            startBtn.disabled = false;
        }


        /* PARTY JOINED */

        if (data.type === "partyJoined") {

            partyCode = data.code;
            isHost = false;

            showParty();

            partyStatus.textContent =
                "WAITING FOR HOST TO START...";

            /*
             * Regular players don't get the start button
             */

            startBtn.style.display = "none";
        }


        /* LOBBY UPDATE */

        if (data.type === "lobby") {

            partyCode = data.code;

            partyCodeDisplay.textContent =
                partyCode;

            updatePlayers(data.players);

            /*
             * HOST CAN START
             */

            if (data.host === localStorage.getItem("backroomsSession")) {

                isHost = true;
                startBtn.style.display = "block";
                startBtn.disabled = false;

                partyStatus.textContent =
                    "YOU ARE THE HOST";

            } else {

                startBtn.style.display = "none";

                partyStatus.textContent =
                    "WAITING FOR HOST TO START...";

            }
        }


        /* GAME STARTED */

        if (data.type === "gameStarted") {

            window.location.href =
                "game.html?party=" +
                encodeURIComponent(partyCode);

        }


        /* ERROR */

        if (data.type === "error") {

            status.textContent =
                data.message || "ERROR";

            partyStatus.textContent =
                data.message || "ERROR";
        }

    };
}


/* SHOW PARTY */

function showParty() {

    menuScreen.classList.add("hidden");
    partyScreen.classList.remove("hidden");

    partyCodeDisplay.textContent =
        partyCode;
}


/* UPDATE PLAYERS */

function updatePlayers(players) {

    playersList.innerHTML = "";

    if (!players || players.length === 0) {
        playersList.innerHTML =
            '<div class="player">NO PLAYERS</div>';
        return;
    }

    players.forEach((player, index) => {

        const div =
            document.createElement("div");

        div.className = "player";

        const name =
            document.createElement("span");

        name.textContent =
            player.name || "Player";

        const role =
            document.createElement("span");

        role.className = "host";

        if (player.host) {
            role.textContent = "HOST";
        } else {
            role.textContent = "PLAYER";
        }

        div.appendChild(name);
        div.appendChild(role);

        playersList.appendChild(div);
    });
}


/* CREATE PARTY */

createBtn.onclick = () => {

    playerName =
        nameInput.value.trim();

    if (!playerName) {

        status.textContent =
            "ENTER YOUR NAME FIRST";

        return;
    }

    connect();

    const sendCreate = () => {

        ws.send(JSON.stringify({
            type: "createParty",
            name: playerName
        }));

    };

    if (ws.readyState === WebSocket.OPEN) {

        sendCreate();

    } else {

        ws.addEventListener(
            "open",
            sendCreate,
            { once: true }
        );

    }
};


/* JOIN PARTY */

joinBtn.onclick = () => {

    playerName =
        nameInput.value.trim();

    const code =
        codeInput.value.trim().toUpperCase();

    if (!playerName) {

        status.textContent =
            "ENTER YOUR NAME FIRST";

        return;
    }

    if (code.length !== 5) {

        status.textContent =
            "ENTER A 5 LETTER PARTY CODE";

        return;
    }

    connect();

    const sendJoin = () => {

        ws.send(JSON.stringify({
            type: "joinParty",
            code: code,
            name: playerName
        }));

    };

    if (ws.readyState === WebSocket.OPEN) {

        sendJoin();

    } else {

        ws.addEventListener(
            "open",
            sendJoin,
            { once: true }
        );

    }
};


/* START GAME */

startBtn.onclick = () => {

    if (!isHost) {

        partyStatus.textContent =
            "ONLY THE HOST CAN START";

        return;
    }

    if (!ws || ws.readyState !== WebSocket.OPEN) {

        partyStatus.textContent =
            "NOT CONNECTED TO SERVER";

        return;
    }

    startBtn.disabled = true;

    partyStatus.textContent =
        "STARTING GAME...";

    ws.send(JSON.stringify({
        type: "startGame"
    }));

};


/* LEAVE PARTY */

leaveBtn.onclick = () => {

    if (ws) {
        ws.close();
    }

    partyCode = "";
    isHost = false;

    partyScreen.classList.add("hidden");
    menuScreen.classList.remove("hidden");

    partyStatus.textContent = "";

    startBtn.style.display = "none";
    startBtn.disabled = false;
};


/* ENTER KEY SUPPORT */

nameInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {
            createBtn.click();
        }

    }
);


codeInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {
            joinBtn.click();
        }

    }
);


/* LOAD */

const savedName =
    localStorage.getItem("backroomsName");

if (savedName) {
    nameInput.value = savedName;
}

nameInput.addEventListener(
    "input",
    () => {

        localStorage.setItem(
            "backroomsName",
            nameInput.value
        );

    }
);

</script>

</body>
</html>
